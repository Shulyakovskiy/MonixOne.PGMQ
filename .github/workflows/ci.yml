name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test and pack
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker for Testcontainers
        run: |
          docker version
          docker info
          docker pull ghcr.io/pgmq/pg17-pgmq:v1.13.0

      - name: Restore
        run: dotnet restore MonixOne.PGMQ.sln --disable-parallel

      - name: Build
        run: >-
          dotnet build MonixOne.PGMQ.sln --configuration Release --no-restore
          --disable-build-servers -m:1 -p:GeneratePackageOnBuild=false

      - name: Test, including PostgreSQL Testcontainers integration
        run: >-
          dotnet test --project
          src/MonixOne.Queue.Pgmq.Tests/MonixOne.Queue.Pgmq.Tests.csproj
          --configuration Release --no-build --no-restore --
          --minimum-expected-tests 11 --no-ansi --progress off

      - name: Pack
        run: >-
          dotnet pack src/MonixOne.Queue.Pgmq/MonixOne.Queue.Pgmq.csproj
          --configuration Release --no-build --output artifacts/nuget
          -p:GeneratePackageOnBuild=false
